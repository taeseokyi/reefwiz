name: dKH 데이터 갱신

on:
  push:
    branches: [master]
    paths:
      - "data/dkh.dat"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: plot-dkh
  cancel-in-progress: false

jobs:
  plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 최신값·시리즈 JSON 생성
        run: |
          # 최근 14일 — dkh.dat 이 날짜 컬럼을 직접 갖는다(2026-08-16~, dkh_dat.py).
          # --plateau: 평탄 이력의 CO₂ 편향 의심 판정(co2_suspect)을 (date,hh) 매칭으로 주입
          python3 bin/make_dkh_json.py data/dkh.dat --json docs/dkh_latest.json --series-json docs/dkh_series.json --recent-days 14 --plateau docs/dkh_plateau_history.json

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dkh_latest.json docs/dkh_series.json
          git diff --cached --quiet || git commit -m "chore: dKH 최신값 자동 갱신"
          git push
